<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mount Zion Haulage &amp; Logistics — Super Admin Login</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="./src/images/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./src/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./src/images/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./src/images/apple-touch-icon.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <link href="./src/output.css" rel="stylesheet" />

    <!-- Theme Guard -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mzhl-theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
          }
          // Clear active session tokens so login screen always displays cleanly
          sessionStorage.removeItem("mzhl-super-auth");
          localStorage.removeItem("mzhl-super-auth");
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="min-h-screen bg-background text-foreground antialiased selection:bg-red-500 selection:text-white font-poppins transition-colors duration-200"
  >
    <!-- Master Super Admin Login Screen -->
    <div
      id="super-login-view"
      class="min-h-screen flex items-center justify-center p-4 bg-gradient-subtle relative"
    >
      <div
        class="absolute top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-3"
      >
        <button
          type="button"
          class="theme-toggle-btn p-2.5 rounded-xl border border-border bg-card text-foreground hover:bg-surface transition-colors cursor-pointer shadow-sm"
          aria-label="Toggle Theme"
        >
          <span class="theme-icon-sun hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </span>
          <span class="theme-icon-moon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
              ></path>
            </svg>
          </span>
        </button>
      </div>

      <div
        class="w-full max-w-md bg-card text-card-foreground rounded-3xl border border-border p-8 sm:p-10 shadow-2xl space-y-6"
      >
        <div class="text-center space-y-3">
          <div
            class="h-20 w-20 rounded-3xl bg-white border border-border/80 dark:border-white/15 shadow-lg flex items-center justify-center p-2.5 mx-auto ring-4 ring-red-500/10"
          >
            <img
              src="./src/images/apple-touch-icon.png"
              alt="Mount Zion Logo"
              class="h-full w-full object-contain"
            />
          </div>
          <div
            class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-red-100 text-red-700 dark:bg-red-950/80 dark:text-red-300"
          >
            <span>Executive Control</span>
          </div>
          <h1 class="text-2xl font-bold font-poppins text-foreground">
            Super Admin Portal
          </h1>
          <p class="text-xs text-muted-foreground">
            Sign in to access executive administration controls.
          </p>
        </div>

                <!-- Banner shown when already authenticated -->
        <div
          id="super-already-logged-banner"
          class="hidden p-3.5 rounded-xl bg-red-50 dark:bg-red-950/60 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs font-medium flex items-center justify-between gap-2"
        >
          <div>You have an active Super Admin session.</div>
          <a
            href="super-admin.html"
            class="px-3 py-1.5 rounded-lg bg-red-600 text-white font-semibold text-xs hover:opacity-90 transition-opacity"
            >Enter Suite &rarr;</a
          >
        </div>

        <div
          id="super-login-error"
          class="hidden p-3.5 rounded-xl bg-red-100 dark:bg-red-950/80 border border-red-300 dark:border-red-800 text-red-700 dark:text-red-300 text-xs font-semibold"
        >
          Access denied. Use <strong>superadmin</strong> /
          <strong>superadmin123</strong> or PIN <strong>9900</strong>.
        </div>

        <form id="super-login-form" class="space-y-4">
          <div>
            <label
              for="super-user-input"
              class="block text-xs font-medium text-muted-foreground mb-1.5"
              >Master Username / PIN</label
            >
            <input
              type="text"
              id="super-user-input"
              value="superadmin"
              class="w-full px-4 py-3 rounded-xl border border-border bg-surface text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-primary font-semibold"
            />
          </div>

          <div>
            <label
              for="super-pass-input"
              class="block text-xs font-medium text-muted-foreground mb-1.5"
              >Password</label
            >
            <input
              type="password"
              id="super-pass-input"
              value="superadmin123"
              class="w-full px-4 py-3 rounded-xl border border-border bg-surface text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <button
            type="submit"
            id="super-login-btn"
            class="w-full py-3.5 rounded-xl bg-gradient-brand text-white font-semibold text-sm shadow-glow hover:opacity-95 transition-opacity cursor-pointer flex items-center justify-center gap-2"
          >
            <span>Unlock Super Admin Suite</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </button>
        </form>

        <div
          class="pt-4 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-muted-foreground"
        >
          <a
            href="index.html"
            class="hover:text-primary transition-colors flex items-center gap-1 font-medium"
          >
            <span>&larr; Public Website</span>
          </a>
          <a
            href="admin-login.html"
            class="hover:text-primary transition-colors font-medium text-primary"
          >
            Staff Admin Portal &rarr;
          </a>
        </div>
      </div>
    </div>

    <!-- Core Scripts -->
    <script src="./src/js/theme.js"></script>
    <script src="./src/js/store.js"></script>
    <script src="./src/js/super-admin/auth.js"></script>
  </body>
</html>
